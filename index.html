<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1.0">
<title>Nexora AI</title>

<style>
*{box-sizing:border-box}
html,body{margin:0;width:100%;height:100%;font-family:Inter,system-ui,sans-serif;background:#080a12;color:#fff}
button,input,textarea{font:inherit}
button{cursor:pointer}

.app{height:100vh;display:flex;overflow:hidden}

/* SIDEBAR */
.sidebar{
 width:280px;background:#0d101a;border-right:1px solid #252a3a;
 display:flex;flex-direction:column;padding:14px;
 transition:.25s
}
.logo{font-size:24px;font-weight:900;margin:8px 10px 18px}
.logo span{color:#8b5cf6}

.newchat{
 width:100%;padding:13px;border:1px solid #34394c;
 border-radius:12px;background:#171b2a;color:white;
 text-align:left
}
.newchat:hover{background:#20263a}

.history{margin-top:18px;overflow:auto;flex:1}
.history-title{font-size:12px;color:#8f95a8;margin:8px}
.chat-item{
 padding:11px 12px;border-radius:10px;color:#d9dced;
 margin-bottom:4px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;
 cursor:pointer
}
.chat-item:hover,.chat-item.active{background:#1b2030}

.side-bottom{border-top:1px solid #252a3a;padding-top:10px}
.side-btn{
 width:100%;padding:11px;background:transparent;color:#cbd0df;
 border:0;border-radius:9px;text-align:left
}
.side-btn:hover{background:#191e2c}

/* MAIN */
.main{flex:1;display:flex;flex-direction:column;min-width:0}

.topbar{
 height:64px;border-bottom:1px solid #252a3a;
 display:flex;align-items:center;padding:0 18px;gap:12px
}
.menu{display:none}
.top-title{font-weight:800;font-size:18px}
.status{margin-left:auto;font-size:12px;color:#8d94a8}

.messages{
 flex:1;overflow-y:auto;padding:25px 18px 120px
}
.message-wrap{max-width:850px;margin:0 auto 20px}
.message{
 display:flex;gap:12px;align-items:flex-start
}
.avatar{
 width:34px;height:34px;border-radius:10px;
 display:flex;align-items:center;justify-content:center;
 background:#272d40;flex:none
}
.user .avatar{background:#7c3aed}
.bubble{
 max-width:80%;padding:13px 16px;border-radius:16px;
 line-height:1.55;white-space:pre-wrap;word-break:break-word
}
.ai .bubble{background:#171b2a}
.user{justify-content:flex-end}
.user .bubble{background:#6d45e8}
.user .avatar{order:2}

.typing{display:flex;gap:4px}
.dot{
 width:7px;height:7px;border-radius:50%;background:#9da4ba;
 animation:b 1s infinite
}
.dot:nth-child(2){animation-delay:.15s}
.dot:nth-child(3){animation-delay:.3s}
@keyframes b{50%{opacity:.25;transform:translateY(-3px)}}

/* INPUT */
.composer{
 position:fixed;bottom:0;left:280px;right:0;
 padding:16px;background:linear-gradient(transparent,#080a12 25%)
}
.composer-inner{
 max-width:850px;margin:auto;display:flex;gap:10px;
 background:#121622;border:1px solid #30364b;
 border-radius:18px;padding:8px
}
textarea{
 flex:1;resize:none;background:transparent;border:0;outline:0;
 color:white;padding:11px 12px;min-height:44px;max-height:150px
}
textarea::placeholder{color:#737b91}
.send{
 width:48px;border:0;border-radius:13px;background:#7c4dff;
 color:white;font-size:20px
}
.send:disabled{opacity:.5}
.hint{text-align:center;font-size:11px;color:#6f768a;margin-top:7px}

/* SETTINGS */
.overlay{
 position:fixed;inset:0;background:#0008;display:none;z-index:10
}
.settings{
 position:fixed;right:-350px;top:0;height:100%;width:340px;
 background:#10131e;border-left:1px solid #292e40;
 z-index:11;padding:20px;transition:.25s
}
.settings.open{right:0}
.overlay.open{display:block}
.settings-head{display:flex;justify-content:space-between;align-items:center}
.close{
 background:#1b2030;border:0;color:white;border-radius:9px;
 padding:8px 11px
}
.setting{
 margin-top:25px;padding:14px;background:#171b28;border-radius:12px
}
.setting label{display:block;font-weight:700;margin-bottom:8px}
.setting small{color:#858ca0}
select{
 width:100%;background:#0d1019;color:white;border:1px solid #33394c;
 border-radius:9px;padding:10px
}

/* MOBILE */
@media(max-width:700px){
 .sidebar{
  position:fixed;z-index:20;left:-290px;top:0;height:100%;
 }
 .sidebar.open{left:0}
 .menu{display:block;background:transparent;color:white;border:0;font-size:22px}
 .composer{left:0}
 .bubble{max-width:86%}
 .topbar{height:58px}
}
</style>
</head>

<body>

<div class="app">

<aside class="sidebar" id="sidebar">
  <div class="logo">NEXORA<span> AI</span></div>

  <button class="newchat" onclick="newChat()">＋ New chat</button>

  <div class="history">
    <div class="history-title">CHAT HISTORY</div>
    <div id="history"></div>
  </div>

  <div class="side-bottom">
    <button class="side-btn" onclick="openSettings()">⚙️ Settings</button>
    <button class="side-btn" onclick="clearHistory()">🗑️ Clear history</button>
  </div>
</aside>

<main class="main">

<header class="topbar">
  <button class="menu" onclick="toggleSidebar()">☰</button>
  <div class="top-title" id="chatTitle">Nexora AI</div>
  <div class="status">● Online</div>
</header>

<section class="messages" id="messages"></section>

<div class="composer">
  <div class="composer-inner">
    <textarea id="input" placeholder="Ask Nexora anything..." rows="1"></textarea>
    <button class="send" id="send">➤</button>
  </div>
  <div class="hint">Nexora AI can make mistakes. Check important information.</div>
</div>

</main>
</div>

<div class="overlay" id="overlay" onclick="closeSettings()"></div>

<div class="settings" id="settings">
  <div class="settings-head">
    <h2>Settings</h2>
    <button class="close" onclick="closeSettings()">✕</button>
  </div>

  <div class="setting">
    <label>Model</label>
    <select id="model">
      <option value="gpt-5">GPT-5</option>
    </select>
    <small>Powered by OpenAI</small>
  </div>

  <div class="setting">
    <label>Appearance</label>
    <select onchange="setTheme(this.value)">
      <option value="dark">Dark</option>
      <option value="light">Light</option>
    </select>
  </div>

  <div class="setting">
    <label>About</label>
    <small>Nexora AI — your personal AI assistant.</small>
  </div>
</div>

<script>
const input=document.getElementById("input");
const send=document.getElementById("send");
const messages=document.getElementById("messages");
const historyBox=document.getElementById("history");

let chats=JSON.parse(localStorage.getItem("nexora_chats")||"[]");
let currentId=localStorage.getItem("nexora_current");

function save(){
 localStorage.setItem("nexora_chats",JSON.stringify(chats));
 localStorage.setItem("nexora_current",currentId||"");
}

function newChat(){
 const chat={
  id:Date.now().toString(),
  title:"New chat",
  messages:[]
 };
 chats.unshift(chat);
 currentId=chat.id;
 save();
 renderHistory();
 renderChat();
 closeMobile();
}

function currentChat(){
 return chats.find(x=>x.id===currentId);
}

function renderHistory(){
 historyBox.innerHTML="";
 chats.forEach(c=>{
  const d=document.createElement("div");
  d.className="chat-item "+(c.id===currentId?"active":"");
  d.textContent=c.title;
  d.onclick=()=>{
   currentId=c.id;
   save();
   renderHistory();
   renderChat();
   closeMobile();
  };
  historyBox.appendChild(d);
 });
}

function renderChat(){
 messages.innerHTML="";
 const chat=currentChat();

 if(!chat){
  newChat();
  return;
 }

 if(chat.messages.length===0){
  addMessage("ai","Hi! I'm Nexora AI. What do you want to know?");
  return;
 }

 chat.messages.forEach(m=>addMessage(m.role,m.content,false));
}

function addMessage(role,text,saveMsg=true){
 const wrap=document.createElement("div");
 wrap.className="message-wrap";

 const row=document.createElement("div");
 row.className="message "+(role==="user"?"user":"ai");

 const av=document.createElement("div");
 av.className="avatar";
 av.textContent=role==="user"?"You":"N";

 const bubble=document.createElement("div");
 bubble.className="bubble";
 bubble.textContent=text;

 row.appendChild(av);
 row.appendChild(bubble);
 wrap.appendChild(row);
 messages.appendChild(wrap);

 messages.scrollTop=messages.scrollHeight;

 if(saveMsg){
  const chat=currentChat();
  chat.messages.push({role,content:text});

  if(role==="user" && chat.title==="New chat"){
   chat.title=text.substring(0,32)+(text.length>32?"…":"");
  }

  save();
  renderHistory();
 }
}

function typing(){
 const wrap=document.createElement("div");
 wrap.className="message-wrap";
 wrap.id="typing";

 const row=document.createElement("div");
 row.className="message ai";

 const av=document.createElement("div");
 av.className="avatar";
 av.textContent="N";

 const bubble=document.createElement("div");
 bubble.className="bubble typing";
 bubble.innerHTML="<span class='dot'></span><span class='dot'></span><span class='dot'></span>";

 row.appendChild(av);
 row.appendChild(bubble);
 wrap.appendChild(row);
 messages.appendChild(wrap);
 messages.scrollTop=messages.scrollHeight;
}

async function askAI(){

 const text=input.value.trim();
 if(!text || send.disabled)return;

 const chat=currentChat();

 addMessage("user",text);
 input.value="";
 input.style.height="44px";

 send.disabled=true;
 typing();

 try{

  const response=await fetch("/api/chat",{
   method:"POST",
   headers:{"Content-Type":"application/json"},
   body:JSON.stringify({
    messages:chat.messages
   })
  });

  const data=await response.json();

  document.getElementById("typing")?.remove();

  if(!response.ok){
   throw new Error(data.error||"AI request failed");
  }

  addMessage("ai",data.reply);

 }catch(err){

  document.getElementById("typing")?.remove();

  addMessage(
   "ai",
   "⚠️ Error: "+err.message+
   "\n\nVercel API/Environment Variable check karo."
  );

 }finally{
  send.disabled=false;
  input.focus();
 }
}

send.onclick=askAI;

input.addEventListener("keydown",e=>{
 if(e.key==="Enter"&&!e.shiftKey){
  e.preventDefault();
  askAI();
 }
});

input.addEventListener("input",()=>{
 input.style.height="44px";
 input.style.height=Math.min(input.scrollHeight,150)+"px";
});

function toggleSidebar(){
 document.getElementById("sidebar").classList.toggle("open");
}

function closeMobile(){
 document.getElementById("sidebar").classList.remove("open");
}

function openSettings(){
 document.getElementById("settings").classList.add("open");
 document.getElementById("overlay").classList.add("open");
}

function closeSettings(){
 document.getElementById("settings").classList.remove("open");
 document.getElementById("overlay").classList.remove("open");
}

function clearHistory(){
 if(confirm("Delete all chat history?")){
  chats=[];
  currentId=null;
  save();
  newChat();
 }
}

function setTheme(v){
 if(v==="light"){
  document.body.style.background="#f5f6fa";
  document.body.style.color="#111";
 }else{
  document.body.style.background="#080a12";
  document.body.style.color="#fff";
 }
}

if(chats.length===0){
 newChat();
}else{
 if(!currentId)currentId=chats[0].id;
 renderHistory();
 renderChat();
}
</script>

</body>
</html>
