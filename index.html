<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1.0">
<title>Nexora AI</title>

<style>
*{box-sizing:border-box}

body{
 margin:0;
 height:100vh;
 overflow:hidden;
 background:#080a10;
 color:white;
 font-family:Arial,sans-serif;
}

.app{
 height:100vh;
 display:flex;
}

.sidebar{
 width:280px;
 background:#111520;
 border-right:1px solid #292e3d;
 padding:15px;
 display:flex;
 flex-direction:column;
 gap:12px;
}

.logo{
 font-size:22px;
 font-weight:bold;
 padding:10px;
}

.btn{
 width:100%;
 padding:12px;
 border:1px solid #343a4e;
 border-radius:12px;
 background:#191e2b;
 color:white;
 cursor:pointer;
}

.history{
 flex:1;
 overflow:auto;
}

.history button{
 width:100%;
 text-align:left;
 border:0;
 background:transparent;
 color:#ddd;
 padding:11px;
 border-radius:9px;
 cursor:pointer;
 white-space:nowrap;
 overflow:hidden;
 text-overflow:ellipsis;
}

.history button:hover{
 background:#1d2331;
}

.bottom{
 border-top:1px solid #292e3d;
 padding-top:10px;
}

.main{
 flex:1;
 min-width:0;
 display:flex;
 flex-direction:column;
}

.top{
 height:58px;
 border-bottom:1px solid #222837;
 display:flex;
 align-items:center;
 padding:0 15px;
 gap:10px;
}

.menu{
 display:none;
 background:none;
 border:0;
 color:white;
 font-size:24px;
}

.title{
 font-weight:bold;
}

.status{
 margin-left:auto;
 color:#8991a5;
 font-size:12px;
}

.chat{
 flex:1;
 overflow:auto;
 padding:25px max(15px,calc((100% - 900px)/2));
}

.msg{
 display:flex;
 gap:10px;
 margin:18px 0;
 align-items:flex-start;
}

.msg.user{
 justify-content:flex-end;
}

.avatar{
 width:35px;
 height:35px;
 border-radius:10px;
 background:#252b3c;
 display:grid;
 place-items:center;
 font-weight:bold;
 flex:none;
}

.user .avatar{
 order:2;
 background:#7547f5;
}

.bubble{
 max-width:80%;
 background:#171b28;
 padding:14px 17px;
 border-radius:17px;
 line-height:1.5;
 white-space:pre-wrap;
 overflow-wrap:anywhere;
}

.user .bubble{
 background:#7042ee;
}

.composer{
 border-top:1px solid #1e2330;
 padding:10px max(15px,calc((100% - 900px)/2)) 15px;
}

.tools{
 display:flex;
 gap:7px;
 overflow:auto;
 margin-bottom:8px;
}

.tool{
 white-space:nowrap;
 border:1px solid #303649;
 background:#111520;
 color:#ddd;
 padding:7px 10px;
 border-radius:9px;
 cursor:pointer;
}

.box{
 display:flex;
 gap:8px;
 background:#111520;
 border:1px solid #343a4d;
 border-radius:18px;
 padding:8px;
}

textarea{
 flex:1;
 min-height:48px;
 max-height:170px;
 resize:none;
 background:none;
 border:0;
 outline:0;
 color:white;
 padding:12px;
 font-size:16px;
}

.send{
 width:50px;
 border:0;
 border-radius:14px;
 background:#7547f5;
 color:white;
 font-size:23px;
 cursor:pointer;
}

.note{
 text-align:center;
 color:#777f91;
 font-size:11px;
 margin-top:7px;
}

.panel{
 position:fixed;
 right:-340px;
 top:0;
 bottom:0;
 width:330px;
 background:#111520;
 border-left:1px solid #33394b;
 padding:18px;
 z-index:20;
 transition:.2s;
}

.panel.open{
 right:0;
}

.panel h2{
 margin-top:0;
}

.panel input,
.panel select{
 width:100%;
 padding:11px;
 background:#0b0e15;
 color:white;
 border:1px solid #343a4d;
 border-radius:9px;
 margin:7px 0 15px;
}

.close{
 float:right;
 background:none;
 border:0;
 color:white;
 font-size:25px;
 cursor:pointer;
}

@media(max-width:700px){

 .sidebar{
  position:fixed;
  left:-290px;
  top:0;
  bottom:0;
  z-index:30;
  transition:.2s;
 }

 .sidebar.open{
  left:0;
 }

 .menu{
  display:block;
 }

 .bubble{
  max-width:88%;
 }

 .chat{
  padding:15px 10px;
 }

 .panel{
  width:90vw;
 }
}
</style>
</head>

<body>

<div class="app">

<!-- SIDEBAR -->
<aside class="sidebar" id="sidebar">

<div class="logo">
✦ NEXORA AI
</div>

<button class="btn" onclick="newChat()">
＋ New Chat
</button>

<div class="history" id="history"></div>

<div class="bottom">

<button class="btn" onclick="clearChats()">
🗑 Clear History
</button>

<br><br>

<button class="btn" onclick="openSettings()">
⚙ Settings
</button>

</div>

</aside>


<!-- MAIN -->
<main class="main">

<header class="top">

<button class="menu" onclick="toggleSidebar()">
☰
</button>

<div class="title">
Nexora AI
</div>

<div class="status" id="status">
● Ready
</div>

<button
onclick="openSettings()"
style="background:none;border:0;color:white;font-size:20px;cursor:pointer">
⚙
</button>

</header>


<!-- CHAT -->
<section class="chat" id="chat"></section>


<!-- COMPOSER -->
<div class="composer">

<div class="tools">

<button class="tool" onclick="startVoice()">
🎙 Voice
</button>

<button class="tool" onclick="chooseFile()">
📎 File
</button>

<button class="tool" onclick="generateImage()">
🎨 Image
</button>

<button class="tool" onclick="webMode()">
🌐 Web
</button>

</div>

<input
id="file"
type="file"
hidden
onchange="fileSelected(this.files[0])">

<div class="box">

<textarea
id="input"
placeholder="Ask Nexora anything..."
></textarea>

<button
class="send"
onclick="sendMessage()">
➤
</button>

</div>

<div class="note">
Enter = Send • Shift + Enter = New line
</div>

</div>

</main>
</div>


<!-- SETTINGS -->
<div class="panel" id="settingsPanel">

<button
class="close"
onclick="closeSettings()">
×
</button>

<h2>⚙ Settings</h2>

<label>Model</label>

<select id="model">
<option>GPT-4.1 mini</option>
<option>GPT-4.1</option>
</select>

<label>Theme</label>

<select id="theme">

<option value="dark">
Dark
</option>

<option value="light">
Light
</option>

</select>

<br><br>

<button class="btn" onclick="saveSettings()">
Save Settings
</button>

</div>


<script>

const STORAGE_KEY="nexora_chats";

let chats=
JSON.parse(
localStorage.getItem(STORAGE_KEY)||"[]"
);

let currentChat=null;


/* SAVE */

function saveChats(){

 localStorage.setItem(
  STORAGE_KEY,
  JSON.stringify(chats)
 );

 renderHistory();

}


/* NEW CHAT */

function newChat(){

 currentChat={
  id:Date.now(),
  title:"New Chat",
  messages:[]
 };

 chats.unshift(currentChat);

 saveChats();

 renderChat();

 closeSidebar();

}


/* HISTORY */

function renderHistory(){

 const history=
 document.getElementById("history");

 history.innerHTML="";

 chats.forEach(chat=>{

  const button=
  document.createElement("button");

  button.textContent=
  "💬 "+chat.title;

  button.onclick=function(){

   currentChat=chat;

   renderChat();

   closeSidebar();

  };

  history.appendChild(button);

 });

}


/* RENDER CHAT */

function renderChat(){

 const chat=
 document.getElementById("chat");

 chat.innerHTML="";

 if(
  !currentChat ||
  currentChat.messages.length===0
 ){

  chat.innerHTML=`

  <div class="msg">

   <div class="avatar">
   N
   </div>

   <div class="bubble">

   Hi! I'm Nexora AI 👋

   <br><br>

   Ask me anything.

   </div>

  </div>

  `;

  return;

 }


 currentChat.messages.forEach(message=>{

  const row=
  document.createElement("div");

  row.className=
  "msg "+
  (message.role==="user"?"user":"");


  const avatar=
  message.role==="user"
  ?"You"
  :"N";


  row.innerHTML=`

  <div class="avatar">
  ${avatar}
  </div>

  <div class="bubble"></div>

  `;


  row.querySelector(".bubble")
  .textContent=
  message.text;


  chat.appendChild(row);

 });


 chat.scrollTop=
 chat.scrollHeight;

}


/* ADD MESSAGE */

function addMessage(role,text){

 if(!currentChat){

  newChat();

 }

 currentChat.messages.push({

  role:role,

  text:text

 });


 if(
  role==="user" &&
  currentChat.title==="New Chat"
 ){

  currentChat.title=
  text.substring(0,30);

 }


 saveChats();

 renderChat();

}


/* SEND */

function sendMessage(){

 const input=
 document.getElementById("input");

 const text=
 input.value.trim();


 if(!text)return;


 addMessage(
  "user",
  text
 );


 input.value="";


 /*
 REAL AI CONNECT KARNE KE LIYE:

 fetch("/api/chat",{
   method:"POST",
   headers:{
     "Content-Type":"application/json"
   },
   body:JSON.stringify({
     messages:currentChat.messages
   })
 })

 */


 addMessage(

  "assistant",

  "Message received ✅\n\n"+
  "Nexora ka interface ready hai. "+
  "Real AI response ke liye backend/API connect karna hoga."

 );

}


/* ENTER SEND */

document
.getElementById("input")
.addEventListener(
 "keydown",
 function(event){

  if(
   event.key==="Enter" &&
   !event.shiftKey
  ){

   event.preventDefault();

   sendMessage();

  }

 }
);


/* SIDEBAR */

function toggleSidebar(){

 document
 .getElementById("sidebar")
 .classList
 .toggle("open");

}


function closeSidebar(){

 document
 .getElementById("sidebar")
 .classList
 .remove("open");

}


/* CLEAR HISTORY */

function clearChats(){

 if(
  confirm(
   "Delete all chat history?"
  )
 ){

  chats=[];

  currentChat=null;

  saveChats();

  renderChat();

 }

}


/* SETTINGS */

function openSettings(){

 document
 .getElementById("settingsPanel")
 .classList
 .add("open");

}


function closeSettings(){

 document
 .getElementById("settingsPanel")
 .classList
 .remove("open");

}


function saveSettings(){

 const theme=
 document.getElementById("theme").value;


 if(theme==="light"){

  document.body.style.background=
  "#f5f5f7";

  document.body.style.color=
  "#111";

 }else{

  document.body.style.background=
  "#080a10";

  document.body.style.color=
  "#fff";

 }


 closeSettings();

}


/* VOICE */

function startVoice(){

 const SpeechRecognition=
 window.SpeechRecognition ||
 window.webkitSpeechRecognition;


 if(!SpeechRecognition){

  alert(
   "Voice recognition is not supported in this browser."
  );

  return;

 }


 const recognition=
 new SpeechRecognition();


 recognition.lang=
 "en-IN";


 recognition.onstart=function(){

  document.getElementById("status")
  .textContent=
  "Listening...";

 };


 recognition.onresult=function(event){

  document.getElementById("input")
  .value=
  event.results[0][0].transcript;

 };


 recognition.onend=function(){

  document.getElementById("status")
  .textContent=
  "● Ready";

 };


 recognition.start();

}


/* FILE */

function chooseFile(){

 document
 .getElementById("file")
 .click();

}


function fileSelected(file){

 if(!file)return;


 addMessage(

  "user",

  "📎 File selected: "+
  file.name

 );


 addMessage(

  "assistant",

  "File selected ✅\n\n"+
  "Real file/PDF analysis ke liye "+
  "backend API connect karna hoga."

 );

}


/* IMAGE */

function generateImage(){

 const prompt=
 window.prompt(
  "Image kya generate karni hai?"
 );


 if(!prompt)return;


 addMessage(
  "user",
  "🎨 Generate image: "+
  prompt
 );


 addMessage(

  "assistant",

  "Image request received 🎨\n\n"+
  "Real image generation ke liye "+
  "image API/backend connect karna hoga."

 );

}


/* WEB */

function webMode(){

 document
 .getElementById("status")
 .textContent=
 "🌐 Web mode ON";


 document
 .getElementById("input")
 .focus();

}


/* START */

renderHistory();

newChat();

</script>

</body>
</html>
